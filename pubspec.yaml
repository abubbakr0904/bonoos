name: bonoos
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  dio: ^5.9.2
  flutter_dotenv: ^6.0.0
  shared_preferences: ^2.5.4
  connectivity_plus: ^7.0.0
  go_router: ^17.1.0
  internet_connection_checker: ^1.0.0+1
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  dartz: ^0.10.1
  get_it: ^9.2.1
  equatable: ^2.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.0
  permission_handler: ^12.0.1
  mask_text_input_formatter: ^2.9.0
  flutter_cache_manager: ^3.4.1
  share_plus: ^12.0.1
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  flutter_screenutil: ^5.9.3
  dropdown_button2: ^3.0.0
  animate_do: ^4.2.0
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_localization: ^0.3.3
  icons_launcher: ^3.0.3
  pinput: ^5.0.1
  just_audio: ^0.10.5
  device_info_plus: ^12.4.0
  flutter_card_swiper: ^7.2.0
  alarm: ^5.2.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/.env
    - assets/Bonoos Chat API (REST + WebSocket).postman_collection.json
    - assets/icons/
    - assets/images/
    - assets/voice/


  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/Dancing_Script/static/DancingScript-Regular.ttf
        - asset: assets/fonts/Dancing_Script/static/DancingScript-Bold.ttf
          weight: 700
        - asset: assets/fonts/Dancing_Script/static/DancingScript-Medium.ttf
          weight: 500
        - asset: assets/fonts/Dancing_Script/static/DancingScript-SemiBold.ttf
          weight: 600




icons_launcher:
  image_path: "assets/images/app_logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true